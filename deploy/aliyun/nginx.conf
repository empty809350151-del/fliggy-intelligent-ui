events { worker_connections 256; }
http {
  access_log off;
  limit_req_zone $binary_remote_addr zone=per_ip:1m rate=6r/m;
  limit_req_zone $server_name zone=global:1m rate=30r/m;
  limit_conn_zone $server_name zone=concurrent:1m;
  server {
    listen 8080;
    client_max_body_size 1m;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    location /api/chat {
      limit_req zone=per_ip burst=3 nodelay;
      limit_req zone=global burst=5 nodelay;
      limit_conn concurrent 3;
      limit_req_status 429;
      limit_conn_status 429;
      proxy_pass http://fliggy-app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location / {
      proxy_pass http://fliggy-app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
