<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>飞猪机舱组件样式总览</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="cabin-kit.css"><link rel="stylesheet" href="fliggy.css">
<style>
:root{--ck-line:#d2d4d9;--ck-ink:#0f131a}*{box-sizing:border-box}body{margin:0;background:#f5f5ff;font-family:"PingFang SC",system-ui;color:#0f131a}.sheet{width:1200px;padding:48px;margin:auto}.header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{color:#6666ff;font-size:13px;letter-spacing:2px;margin-bottom:10px}h1{font-size:32px;font-weight:600;margin:0}header p{color:#919499;font-size:13px;margin:0 0 5px}h2{font-size:17px;font-weight:500;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border-radius:12px;padding:24px;min-width:0}.wide{grid-column:span 2}.state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px}.state{text-align:center;color:#5c5f66;font-size:12px}.state button{max-width:54px;margin-bottom:9px}.state p{margin:0}.spec{margin-top:16px;font-size:12px;color:#919499;line-height:1.6}.caption{font-size:12px;color:#919499;margin:12px 0 8px}.swatches{display:flex;gap:20px}.swatch{font-size:11px;color:#5c5f66}.swatch i{display:block;width:45px;height:30px;border-radius:6px;margin-bottom:6px}.flow{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:6px;padding:8px 12px;font:500 13px "PingFang SC";background:#f5f5f5;color:#0f131a}.chip.active{background:#ebebff;color:#6666ff}.mini-row{max-width:280px;margin:auto}.geometry{display:grid;grid-template-columns:1fr 1fr;gap:18px}.shape{background:#f5f5ff;padding:10px;border-radius:6px}.shape .ck-nose{margin:0}.shape .ck-hull{height:20px}.shape .ck-tail{height:60px}.geometry .caption{text-align:center}.facility .ck-services{margin:0!important}.iui-cabin-module{padding:0;gap:0}.state-grid.iui-cabin-module{gap:20px 16px}.geometry.iui-cabin-module{gap:18px}.section-demo .ck-section{margin:14px 0!important}.footer{display:flex;justify-content:space-between;color:#919499;font-size:12px;margin-top:24px}.stack{display:flex;flex-direction:column;gap:18px}.recommend{padding:16px!important;flex:1!important}.recommend span{display:block}.selection{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f4;font-size:13px;line-height:1.8}.full{grid-column:span 2}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px}.number{color:#6666ff;font-size:12px;margin-right:6px}
</style>
<div class="sheet"><header class="header"><div><div class="eyebrow">FLIGGY · CABIN COMPONENTS</div><h1>机舱俯视图 · 组件样式总览</h1></div><p>简体中文 / 交互组件 / 2026.10</p></header>
<div class="grid">
<section class="panel wide"><h2><span class="number">01</span>座位状态</h2><div id="states" class="state-grid iui-cabin-module"></div><div class="spec">普通 · 偏好匹配 · 已预选 · 不可选 · 出口排 · 无窗标识<br>紫色表达匹配与选中；形状和文字保留座位语义。</div></section>

<section class="panel"><h2><span class="number">02</span>座位排与过道</h2><div id="rows" class="iui-cabin-module mini-row"></div><div class="spec">座位组自动形成过道；支持单过道、双过道，以及缺位结构。</div></section>
<section class="panel"><h2><span class="number">03</span>机头与机尾</h2><div class="geometry iui-cabin-module" id="geometry"></div><div class="spec">连续机身轮廓；机头与机身两侧对齐。</div></section>

<section class="panel full"><h2><span class="number">04</span>舱段、设施与结构标识</h2><div class="bottom"><div class="iui-cabin-module section-demo" id="sections"></div><div class="iui-cabin-module facility" id="facilities"></div><div class="iui-cabin-module" id="markers"></div></div></section>
</div><footer class="footer"><span>基于 Fliggy 实际组件渲染 · 展示尺寸仅用于样式对照</span><span>机舱配置参考 / 非实时余位 / 不提交值机</span></footer></div>
<script type="module">
import {CabinKit as K} from './cabin-kit.js';
const put=(id,node)=>document.getElementById(id).append(node);
for(const [label,props,cls,selected] of [['普通座位',{},'',false],['匹配偏好',{},'ck-match',false],['已预选',{},'',true],['不可选',{disabled:true},'',false],['出口排',{exit:true},'',false],['无窗座位',{noWindow:true},'',false]]){const box=document.createElement('div');box.className='state';const b=K.Seat({id:'31A',letter:'A',position:'window',...props});if(cls)b.classList.add(cls);if(selected)b.setAttribute('aria-pressed','true');box.append(b);const p=document.createElement('p');p.textContent=label;box.append(p);put('states',box)}
for(const [label,groups] of [['2–2 · 单过道',[['A','C'],['H','K']]],['3–3 · 单过道',[['A','B','C'],['H','J','K']]],['2–3–2 · 双过道',[['A','B'],['D','E','F'],['J','K']]]]){const p=document.createElement('p');p.className='caption';p.textContent=label;put('rows',p);put('rows',K.SeatRow({number:31,groups}))}
for(const name of ['机头','机尾']){const w=document.createElement('div');const shape=document.createElement('div');shape.className='shape';const hull=document.createElement('div');hull.className='ck-hull';if(name==='机头')shape.append(K.Nose({label:''}),hull);else shape.append(hull,K.Tail({label:''}));w.append(shape);const p=document.createElement('p');p.className='caption';p.textContent=name;w.append(p);put('geometry',w)}
put('sections',K.SectionLabel({title:'商务舱',subtitle:'4座 · 第5排 · 2–2'}));put('sections',K.Divider({label:''}));put('sections',K.SectionLabel({title:'经济舱',subtitle:'138座 · 3–3'}));
put('facilities',K.ServiceRow({columns:2,items:[{kind:'lavatory',label:'洗手间'},{kind:'galley',label:'厨房'}]}));put('facilities',K.ServiceRow({items:[{kind:'lavatory',accessible:true,label:'无障碍洗手间'}]}));
put('markers',K.Exit({label:'翼上紧急出口'}));put('markers',K.Annotation({text:'机翼附近区域 · 布局参考'}));put('markers',K.Divider({label:'舱段分隔'}));
</script></html>
